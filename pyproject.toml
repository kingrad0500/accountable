[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM that grows into a Business OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/accountable"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
    # Starlette suggests a different HTTP client for its TestClient; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
