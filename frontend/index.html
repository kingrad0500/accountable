<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accountable</title>
    <script>
      // Apply the stored mode before the first paint, so a reload in dark mode never
      // flashes light (G11). The key matches THEME_KEY in src/lib/theme.ts.
      try {
        if (localStorage.getItem("accountable.theme") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch {
        // Storage can be blocked; light mode is the default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
