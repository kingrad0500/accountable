<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Pipeline · Direction B</title>
<link rel="stylesheet" href="shared/tokens.css">
<script src="shared/data.js"></script>
<script src="shared/shell-b.js"></script>
<style id="shell"></style>
<style>
  .tools { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .strip { display: flex; align-items: center; gap: 6px; padding: 6px; }
  .strip .s { padding: 6px 14px; border-radius: 10px; }
  .strip .s span { display: block; font-size: 11.5px; color: var(--ink-muted); font-weight: 500; }
  .strip .s b { font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
  .strip .s.dark { background: var(--ink); color: #fff; }
  .strip .s.dark span { color: var(--sea-mist); }
  .dd { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; margin-left: auto; }
  .dd em { font-style: normal; color: var(--ink-muted); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)) repeat(2, minmax(170px, 0.85fr)); gap: 12px; align-items: start; }
  .hd { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .hd .r1 { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
  .hd .r1 .n { font-family: var(--font-mono); font-size: 12px; font-weight: 600; opacity: .85; }
  .hd .tot { font-family: var(--font-mono); font-size: 20px; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; }
  .hd .ex { font-size: 12px; opacity: .85; }
  .hd .ex b { font-family: var(--font-mono); font-weight: 600; }
  .meter { height: 4px; border-radius: 99px; background: rgb(7 59 76 / .15); margin-top: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: currentColor; border-radius: 99px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .c { background: var(--panel); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
  .c .nm { font-weight: 600; font-size: 13px; line-height: 1.3; }
  .c .v { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
  .c .m { font-size: 12px; color: var(--ink-muted); grid-column: span 2; }
  .c .d { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 5px; }
  .c .lt { justify-self: end; }
  .c.is-late { background: #FFF3F5; }
  .c.is-late .d { color: var(--raspberry-ink); font-weight: 600; }
  .c.slim { grid-template-columns: 1fr auto; padding: 8px 12px; }
  .addbtn { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; color: var(--ink-muted); font-size: 13px; font-weight: 500; }
  .addbtn:hover { background: var(--panel); }
  .form { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-lift); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .form label { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; }
  .form .in { white-space: nowrap; height: 32px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .form .in.focus { outline: 2px solid var(--cerulean); outline-offset: 1px; background: #fff; }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
  .form .acts .btn { height: 30px; font-size: 13px; padding: 0 12px; }
  .more { font-size: 12px; color: var(--ink-muted); padding: 8px 4px; }
  .more a { color: var(--cerulean-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="b-page" id="app"></div>
<script>
document.getElementById('shell').textContent = SHELL_B_CSS;

const headColors = {
  new: ['var(--cerulean-ink)', '#fff'], qualified: ['var(--marigold)', 'var(--ink)'], proposal: ['var(--coral)', 'var(--ink)'],
  negotiation: ['var(--ink)', '#fff'], won: ['var(--sea-green)', 'var(--ink)'], lost: ['var(--sea-mist)', 'var(--ink)'],
};

const card = (d, closed) => closed
  ? `<article class="c slim" tabindex="0"><span class="nm">${d.name}</span><span class="v">${usdShort(d.value)}</span><span class="m">${d.org}</span><span class="d">${fmtDate(d.close)}</span></article>`
  : `<article class="c ${isLate(d) ? 'is-late' : ''}" tabindex="0">
      <span class="nm">${d.name}</span><span class="v">${usd(d.value)}</span>
      <span class="m">${d.org} · ${d.prob}%</span><span class="d">${icon('calendar', 12)}${fmtDate(d.close)}</span><span class="lt">${isLate(d) ? '<span class="pill late" style="font-size:11px;padding:0 7px;line-height:17px">Late</span>' : `<span class="avatar" style="width:20px;height:20px;font-size:9px">${d.who}</span>`}</span>
    </article>`;

const column = (s) => {
  const t = colTotals(s.key);
  const closed = s.key === 'won' || s.key === 'lost';
  const [bg, fg] = headColors[s.key];
  const addForm = s.key === 'qualified' ? `
    <div class="form" role="group" aria-label="New deal in Qualified">
      <label>Deal name<span class="in focus">Payroll integration|</span></label>
      <label>Organization<span class="in">Tallow &amp; Finch ${icon('chevron', 14)}</span></label>
      <div class="row"><label>Value (USD)<span class="in mono">$36,000</span></label><label>Close date<span class="in mono">20 Feb</span></label></div>
      <div class="acts"><button class="btn btn-quiet">Cancel</button><button class="btn btn-primary">Add to Qualified</button></div>
    </div>` : `<button class="addbtn">${icon('plus', 14, 2.5)} Add deal</button>`;
  return `<section aria-label="${s.name}">
    <header class="hd" style="background:${bg};color:${fg}">
      <div class="r1"><span>${s.name}</span><span class="n">${t.count} deals</span></div>
      <div class="tot">${usd(t.value)}</div>
      ${closed ? `<div class="ex">${s.key === 'won' ? 'Closed in the last 90 days' : 'Closed in the last 90 days'}</div>`
        : `<div class="ex">Expected <b>${usd(t.expected)}</b></div><div class="meter" title="Share of open value"><i style="width:${(t.value / FIG.openValue) * 100}%"></i></div>`}
    </header>
    <div class="stack">
      ${addForm}
      ${dealsIn(s.key).map((d) => card(d, closed)).join('')}
      ${closed ? `<p class="more">${s.key === 'won' ? 9 : 6} more closed earlier. <a href="#">See in Deals</a></p>` : ''}
    </div>
  </section>`;
};

document.getElementById('app').innerHTML = shellB('pipeline') + `
<div class="tools">
  <div class="panel strip">
    <div class="s dark"><span>Open value (USD)</span><b>${usd(FIG.openValue)}</b></div>
    <div class="s"><span>Expected revenue (USD)</span><b>${usd(FIG.expected)}</b></div>
    <div class="s"><span>Open deals</span><b>${FIG.openCount}</b></div>
    <div class="s"><span>Late</span><b style="color:var(--raspberry-ink)">${FIG.lateCount}</b></div>
  </div>
  <button class="dd" aria-haspopup="listbox">${icon('filter', 15)}<em>Closed deals:</em> Last 90 days ${icon('chevron', 15)}</button>
</div>
<div class="board">${STAGES.map(column).join('')}</div>`;
</script>
</body>
</html>
