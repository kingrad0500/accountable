<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Pipeline · Direction C</title>
<link rel="stylesheet" href="shared/tokens.css">
<script src="shared/data.js"></script>
<script src="shared/shell-c.js"></script>
<style id="shell"></style>
<style>
  body { position: relative; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; gap: 20px; }
  .totals { display: flex; gap: 32px; align-items: flex-end; }
  .totals div span { display: block; font-size: 12px; color: var(--ink-muted); font-weight: 500; }
  .totals div b { font-family: var(--font-mono); font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
  .tabs { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; font-size: 13px; }
  .tabs .lbl { color: var(--ink-muted); }
  .tabs a { color: var(--ink-muted); font-weight: 500; padding: 4px 0; }
  .tabs a.on { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--sea-green); text-decoration-thickness: 3px; text-underline-offset: 7px; }
  .tabs .hint { margin-left: auto; color: var(--ink-muted); display: flex; align-items: center; gap: 6px; }
  kbd { font-family: var(--font-mono); font-size: 11px; background: var(--panel); border-radius: 5px; padding: 1px 6px; box-shadow: var(--shadow); color: var(--ink); }
  .board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 16px; align-items: start; }
  .ch { padding: 0 4px 12px; }
  .ch .r1 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  .ch .r1 .dot { width: 8px; height: 8px; border-radius: 99px; }
  .ch .r1 .n { margin-left: auto; font-family: var(--font-mono); color: var(--ink-muted); letter-spacing: 0; }
  .ch .tot { font-family: var(--font-mono); font-size: 21px; font-weight: 600; letter-spacing: -0.03em; margin-top: 8px; }
  .ch .ex { font-size: 12px; color: var(--ink-muted); }
  .ch .ex b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); position: relative; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .nm { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .card .org { font-size: 12px; color: var(--ink-muted); margin-top: 3px; }
  .card .val { font-family: var(--font-mono); font-weight: 600; font-size: 16px; letter-spacing: -0.02em; margin-top: 12px; }
  .prob { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .prob .tr { flex: 1; height: 5px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .prob .tr i { display: block; height: 100%; border-radius: 99px; }
  .prob span { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }
  .card .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .card .dt { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }
  .card.is-late .dt { color: var(--raspberry-ink); font-weight: 600; }
  .card.focus { outline: 2px solid var(--cerulean); outline-offset: 2px; }
  .card.picked { box-shadow: var(--shadow-lift); transform: translateY(-3px); }
  .kebab { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: var(--ink-muted); margin: -4px -6px 0 0; }
  .kebab.on { background: var(--bg); color: var(--ink); }
  .menu { position: absolute; top: 30px; right: -8px; z-index: 5; width: 196px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-lift); padding: 6px; }
  .menu .h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); padding: 6px 10px 4px; }
  .menu a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; }
  .menu a.cur { color: var(--ink-muted); }
  .menu a.cur::after { content: "Now"; margin-left: auto; font-size: 11px; }
  .menu a.hl { background: var(--bg); font-weight: 600; }
  .menu .dot { width: 8px; height: 8px; border-radius: 99px; }
  .menu hr { border: 0; height: 1px; background: var(--tint); margin: 6px 4px; }
  .add { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--ink-muted); background: rgb(255 255 255 / 0.55); }
  .more { font-size: 12px; color: var(--ink-muted); text-align: center; padding: 4px; }
  .more a { color: var(--cerulean-ink); font-weight: 600; }
  .live { position: absolute; right: 40px; bottom: 28px; background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; box-shadow: var(--shadow-lift); }
  .live kbd { background: rgb(205 216 219 / 0.15); color: #fff; box-shadow: none; }
</style>
</head>
<body>
<div class="c-wrap" id="app"></div>
<script>
document.getElementById('shell').textContent = SHELL_C_CSS;
const barColor = { new: 'var(--cerulean)', qualified: 'var(--marigold)', proposal: 'var(--coral)', negotiation: 'var(--ink)', won: 'var(--sea-green)', lost: 'var(--sea-mist)' };

const menu = (cur) => `<div class="menu" role="menu" aria-label="Move to">
  <div class="h">Move to</div>
  ${STAGES.map((s) => `<a href="#" role="menuitem" class="${s.key === cur ? 'cur' : ''} ${s.key === 'won' ? 'hl' : ''}"><span class="dot" style="background:${s.dot}"></span>${s.name}</a>`).join('')}
  <hr><a href="#" role="menuitem">${icon('deals', 14)} Open deal</a><a href="#" role="menuitem">${icon('note', 14)} Log activity</a>
</div>`;

const card = (d) => {
  const focused = d.name === 'Managed cloud contract';
  return `<article class="card ${isLate(d) ? 'is-late' : ''} ${focused ? 'focus' : ''}" tabindex="0" aria-label="${d.name}, ${usd(d.value)}">
    <div class="top"><div><div class="nm">${d.name}</div><div class="org">${d.org}</div></div>
      <button class="kebab ${focused ? 'on' : ''}" aria-label="Actions for ${d.name}">${icon('more', 16)}</button></div>
    <div class="val">${usd(d.value)}</div>
    ${d.stage === 'won' || d.stage === 'lost' ? '' : `<div class="prob"><div class="tr"><i style="width:${d.prob}%;background:${barColor[d.stage]}"></i></div><span>${d.prob}%</span></div>`}
    <div class="ft"><span class="dt">${d.stage === 'won' || d.stage === 'lost' ? 'Closed ' : ''}${fmtDate(d.close)}</span>
      ${isLate(d) ? '<span class="pill late">Late</span>' : `<span class="avatar">${d.who}</span>`}</div>
    ${focused ? menu(d.stage) : ''}
  </article>`;
};

const column = (s) => {
  const t = colTotals(s.key);
  const closed = s.key === 'won' || s.key === 'lost';
  return `<section aria-label="${s.name}">
    <header class="ch">
      <div class="r1"><span class="dot" style="background:${s.dot}"></span>${s.name}<span class="n">${t.count}</span></div>
      <div class="tot">${usd(t.value)}</div>
      <div class="ex">${closed ? 'Closed in the last 90 days' : `Expected <b>${usd(t.expected)}</b>`}</div>
    </header>
    <div class="stack">
      <button class="add">${icon('plus', 14, 2.5)} Add deal</button>
      ${dealsIn(s.key).map(card).join('')}
      ${closed ? `<p class="more">${s.key === 'won' ? 9 : 6} more closed earlier · <a href="#">See all</a></p>` : ''}
    </div>
  </section>`;
};

document.getElementById('app').innerHTML = shellC('pipeline') + `
<main class="c-main">
  <header class="head">
    <div><div class="c-eyebrow">${FIG.openCount} open deals, ${FIG.lateCount} running late</div><h1 class="c-h1">Pipeline</h1></div>
    <div class="totals">
      <div><span>Open value (USD)</span><b>${usd(FIG.openValue)}</b></div>
      <div><span>Expected revenue (USD)</span><b style="color:var(--sea-green-ink)">${usd(FIG.expected)}</b></div>
      <button class="btn btn-primary">${icon('plus', 16, 2.5)} Add deal</button>
    </div>
  </header>
  <div class="tabs" role="radiogroup" aria-label="Closed deals">
    <span class="lbl">Closed deals</span>
    <a href="#" role="radio" aria-checked="false">Last 30 days</a>
    <a href="#" role="radio" aria-checked="true" class="on">Last 90 days</a>
    <a href="#" role="radio" aria-checked="false">Last 12 months</a>
    <a href="#" role="radio" aria-checked="false">All</a>
    <span class="hint"><kbd>Space</kbd> pick up <kbd>←</kbd><kbd>→</kbd> move <kbd>Space</kbd> drop</span>
  </div>
  <div class="board">${STAGES.map(column).join('')}</div>
</main>
<div class="live" role="status">${icon('check', 16, 2.5)} Robotics telemetry moved from Qualified to Proposal. Probability is now 50%. <a href="#" style="color:var(--sea-green);font-weight:600">Undo</a></div>`;
</script>
</body>
</html>
