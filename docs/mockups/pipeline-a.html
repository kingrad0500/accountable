<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Pipeline · Direction A</title>
<link rel="stylesheet" href="shared/tokens.css">
<script src="shared/data.js"></script>
<script src="shared/shell-a.js"></script>
<style id="shell"></style>
<style>
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .sum { display: flex; gap: 28px; padding: 14px 22px; }
  .sum div { display: flex; flex-direction: column; gap: 2px; }
  .sum span { font-size: 12px; color: var(--ink-muted); font-weight: 500; }
  .sum b { font-family: var(--font-mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .seg { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  .seg .lbl { font-size: 12.5px; color: var(--ink-muted); padding: 0 8px 0 10px; font-weight: 500; }
  .seg button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-muted); }
  .seg button.on { background: var(--ink); color: #fff; font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 12px; align-items: stretch; overflow-x: auto; }
  .col { background: var(--tint); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 640px; }
  .col.closed { background: #EBF0F1; }
  .ch { padding: 6px 6px 8px; }
  .ch .r1 { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; }
  .ch .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); background: var(--panel); border-radius: 999px; padding: 0 7px; margin-left: auto; }
  .ch .r2 { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--font-mono); font-size: 12.5px; }
  .ch .r2 em { font-style: normal; color: var(--ink-muted); }
  .add { display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; border-radius: 10px; color: var(--ink-muted); font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1.5px #C6D3D7; }
  .card { background: var(--panel); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .card .nm { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .card .org { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .card .val { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; }
  .card .pr { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
  .card .dt { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 5px; }
  .card.is-late .dt { color: var(--raspberry-ink); font-weight: 600; }
  .card.lift { transform: rotate(-2deg) translateY(-2px); box-shadow: var(--shadow-lift); }
  .gap { height: 124px; border-radius: 12px; background: repeating-linear-gradient(-45deg, rgb(7 59 76 / .05) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1.5px #A9BEC4; }
  .more { font-size: 12px; color: var(--ink-muted); text-align: center; padding: 6px; }
  .more a { color: var(--cerulean-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="a-wrap" id="app"></div>
<script>
document.getElementById('shell').textContent = SHELL_A_CSS;

const card = (d, extra = '') => `
  <article class="card ${isLate(d) ? 'is-late' : ''} ${extra}" tabindex="0" aria-label="${d.name}">
    <div><div class="nm">${d.name}</div><div class="org">${d.org}</div></div>
    <div class="row"><span class="val">${usd(d.value)}</span><span class="pr">${d.prob}%</span></div>
    <div class="row"><span class="dt">${icon('calendar', 12)}${fmtDate(d.close)}</span>
      ${isLate(d) ? '<span class="pill late">Late</span>' : `<span class="avatar">${d.who}</span>`}</div>
  </article>`;

const column = (s) => {
  let ds = dealsIn(s.key);
  const t = colTotals(s.key);
  const closed = s.key === 'won' || s.key === 'lost';
  let body = ds.map((d) => card(d)).join('');
  // Show a card mid-drag: Website rebuild lifted from Proposal over Negotiation.
  if (s.key === 'proposal') body = ds.filter((d) => d.name !== 'Website rebuild').map((d) => card(d)).join('');
  if (s.key === 'negotiation') {
    const [a, ...rest] = ds;
    body = card(a) + `<div style="position:relative"><div class="gap"></div><div style="position:absolute;inset:-4px -6px auto 6px">${card(DEALS.find((d) => d.name === 'Website rebuild'), 'lift')}</div></div>` + rest.map((d) => card(d)).join('');
  }
  return `<section class="col ${closed ? 'closed' : ''}" aria-label="${s.name}">
    <header class="ch">
      <div class="r1"><span class="dot" style="background:${s.dot}"></span>${s.name}<span class="n">${t.count}</span></div>
      <div class="r2"><span>${usd(t.value)}</span>${closed ? '' : `<em title="Expected revenue">${usd(t.expected)}</em>`}</div>
    </header>
    <button class="add">${icon('plus', 14, 2.5)} Add deal</button>
    ${body}
    ${closed ? `<p class="more">${s.key === 'won' ? 9 : 6} more closed earlier · <a href="#">See all</a></p>` : ''}
  </section>`;
};

document.getElementById('app').innerHTML = shellA('pipeline') + `
<main class="a-main">
  <header class="a-head">
    <div><h1>Pipeline</h1></div>
    <button class="btn btn-primary">${icon('plus', 16, 2.5)} Add deal</button>
  </header>
  <div class="bar">
    <div class="panel sum">
      <div><span>Open value (USD)</span><b>${usd(FIG.openValue)}</b></div>
      <div><span>Expected revenue (USD)</span><b>${usd(FIG.expected)}</b></div>
      <div><span>Open deals</span><b>${FIG.openCount}</b></div>
      <div><span>Late</span><b style="color:var(--raspberry-ink)">${FIG.lateCount}</b></div>
    </div>
    <div class="seg" role="radiogroup" aria-label="Closed deals">
      <span class="lbl">Closed deals</span>
      <button role="radio" aria-checked="false">30 days</button>
      <button role="radio" aria-checked="true" class="on">90 days</button>
      <button role="radio" aria-checked="false">12 months</button>
      <button role="radio" aria-checked="false">All</button>
    </div>
  </div>
  <div class="board">${STAGES.map(column).join('')}</div>
</main>`;
</script>
</body>
</html>
